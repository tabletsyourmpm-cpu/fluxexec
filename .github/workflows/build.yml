name: Build libfluxexec.so (ARM64)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install NDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          sdkmanager "ndk;25.2.9519653"
          ls $ANDROID_HOME/ndk/

      - name: Build ARM64
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          NDK=$ANDROID_HOME/ndk/25.2.9519653
          CLANG=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android31-clang++
          $CLANG -shared -fPIC -O2 \
            -o libfluxexec.so fluxexec.cpp \
            -ldl -llog
          file libfluxexec.so
          ls -lh libfluxexec.so

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libfluxexec-arm64
          path: libfluxexec.so
