name: Build libfluxexec.so (ARM64)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25b
          add-to-path: false

      - name: Build ARM64
        run: |
          CLANG=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android31-clang++
          $CLANG -shared -fPIC -O2 \
            -o libfluxexec.so fluxexec.cpp \
            -ldl -llog
          file libfluxexec.so
          ls -lh libfluxexec.so

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libfluxexec-arm64
          path: libfluxexec.so
