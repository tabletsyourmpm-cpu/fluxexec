name: Build libfluxexec.so (ARM64)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;25.2.9519653"

      - name: Build ARM64
        run: |
          NDK=$ANDROID_HOME/ndk/25.2.9519653
          CLANG=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android31-clang++
          $CLANG -shared -fPIC -O2 \
            -o libfluxexec.so fluxexec.cpp \
            -ldl -llog
          file libfluxexec.so
          ls -lh libfluxexec.so

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libfluxexec-arm64
          path: libfluxexec.so
